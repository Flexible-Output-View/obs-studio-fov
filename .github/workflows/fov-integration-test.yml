name: FOV Integration Test

on:
  pull_request:

env:
  IS_RELEASE_BRANCH: ${{ github.ref_name == 'dev' || github.ref_name == 'master' }}

jobs:
  integration_test:
    name: FOV - E2E Integration Test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Setup Docker
        uses: docker/setup-docker-action@v5.5.0

      - name: Clone FOV Software repository (dev)
        run: git clone -b dev --recurse-submodules https://github.com/Flexible-Output-View/obs-studio-fov.git

      - name: Clone FOV Web repository (dev)
        run: git clone -b dev --recurse-submodules https://github.com/Flexible-Output-View/web-fov.git

      - name: Prepare test environment dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb pulseaudio netcat-openbsd ffmpeg jq curl

          pulseaudio -D --exit-idle-time=-1
          pacmd load-module module-null-sink sink_name=DummySink

      - name: Run FOV Web Stack
        working-directory: web-fov
        run: |
          cp .env.example .env
          docker compose up -d --build --wait

      - name: Install FOV Software prerequisites
        working-directory: obs-studio-fov
        run: ./requirements.sh

      - name: Build FOV Software
        working-directory: obs-studio-fov
        run: ./.github/scripts/FOV/build_integration_test.sh

      - name: Start FOV Headlessly & Auto-Stream
        working-directory: obs-studio-fov
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            build/rundir/Release/bin/obs --portable --startstreaming > ../obs-stdout.log 2>&1 &

      - name: Verify Stream via API
        run: |
          echo "Waiting for stream with 2 video and 2 audio tracks in /api/streams/available..."

          MAX_RETRIES=45
          COUNT=0

          until [ $COUNT -ge $MAX_RETRIES ]; do
            RESPONSE=$(curl -s http://localhost:4000/api/streams/available || true)

            # Assert: 1+ streams exist, exactly 2 video tracks (isVideo: true), and exactly 2 audio tracks (isAudio: true)
            if echo "$RESPONSE" | jq -e '
              (length > 0) and
              (.[0].tracks | map(select(.isVideo == true)) | length == 2) and
              (.[0].tracks | map(select(.isAudio == true)) | length == 2)
            ' > /dev/null 2>&1; then
              echo "Stream successfully verified with 2 video and 2 audio tracks!"
              echo "API Payload:"
              echo "$RESPONSE" | jq .
              exit 0
            fi

            COUNT=$((COUNT+1))
            sleep 1
          done

          echo "ERROR: Stream with required tracks was not detected after $MAX_RETRIES seconds."
          echo "Last raw API response:"
          curl -v http://localhost:4000/api/streams/available || true
          exit 1

      - name: Collect Docker Logs
        if: always()
        working-directory: web-fov
        run: docker compose logs > ../docker-web-stack.log

      - name: Upload Test Artifacts & Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-logs
          path: |
            docker-web-stack.log
            obs-stdout.log
