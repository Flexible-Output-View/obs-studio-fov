name: FOV Integration Test

on:
  push:
    branches:
      - master
      - dev
  pull_request:
    branches:
      - dev
      - master
      - bump-dependencies
      - 'dependabot/**'

jobs:
  integration_test:
    name: FOV - E2E Integration Test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Setup Docker
        uses: docker/setup-docker-action@v5.5.0

      - name: Checkout FOV Software repository
        uses: actions/checkout@v7
        with:
          path: obs-studio-fov
          submodules: recursive

      - name: Clone FOV Web repository (dev)
        run: git clone -b dev --recurse-submodules https://github.com/Flexible-Output-View/web-fov.git

      - name: Prepare test environment dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb pulseaudio netcat-openbsd ffmpeg jq curl python3-pip

          pulseaudio -D --exit-idle-time=-1
          pacmd load-module module-null-sink sink_name=DummySink

      - name: Run FOV Web Stack
        working-directory: web-fov
        run: |
          cp .env.example .env
          mkdir -p media var/media hls
          sudo chmod -R 777 .
          docker compose up -d --build --wait

      - name: Install FOV Software prerequisites
        working-directory: obs-studio-fov
        run: sudo ./requirements.sh

      - name: Create User & Configure Stream Settings
        working-directory: obs-studio-fov
        run: |
          set -o pipefail
          python3 .github/scripts/FOV/integration_setup_stream.py 2>&1 | tee setup-stream.log

      - name: Build FOV Software
        working-directory: obs-studio-fov
        env:
          FOV_INTEGRATION_TEST_KEY: ${{ env.FOV_INTEGRATION_TEST_KEY }}
        run: ./.github/scripts/FOV/build_integration_test.sh

      - name: Start FOV Headlessly & Auto-Stream with Stream Key
        working-directory: obs-studio-fov
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            build/rundir/Release/bin/obs --portable > ../obs-stdout.log 2>&1 &

      - name: Verify Stream via API
        working-directory: obs-studio-fov
        run:  |
          set -o pipefail
          python3 .github/scripts/FOV/integration_test.py 2>&1 | tee integration-test.log

      - name: Collect Docker Logs
        if: always()
        working-directory: web-fov
        run: docker compose logs > ../docker-web-stack.log

      - name: Upload Test Artifacts & Logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-logs
          path: |
            docker-web-stack.log
            obs-stdout.log
            obs-studio-fov/setup-stream.log
            obs-studio-fov/integration-test.log
