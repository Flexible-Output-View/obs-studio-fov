name: FOV Windows & macOS Builds

on:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  check_program_compilation_windows:
    name: FOV - Build on Windows
    runs-on: [ self-hosted, windows, x64 ]
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build Release
        shell: powershell
        run: ./.github/scripts/FOV/build_windows_release.ps1

      - name: Zip Release Package
        shell: powershell
        run: Compress-Archive -Path build_x64/rundir/Release/* -DestinationPath FOV-windows-x64-release.zip -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v7
        with:
          name: FOV-windows-x64-release
          path: FOV-windows-x64-release.zip

      - name: Upload to Existing Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ github.ref_name }} FOV-windows-x64-release.zip --clobber

  check_program_compilation_macos:
    name: FOV - Build on macOS
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build Release
        run: ./.github/scripts/FOV/build_macos_release.sh

      - name: Package Release DMG
        run: ./.github/scripts/FOV/package_dmg.sh build_macos FOV-macos-arm64-release.dmg

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v7
        with:
          name: FOV-macos-arm64-release-dmg
          path: FOV-macos-arm64-release.dmg

      - name: Upload to Existing Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ github.ref_name }} FOV-macos-arm64-release.dmg --clobber
